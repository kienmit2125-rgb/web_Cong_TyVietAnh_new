<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Việt Anh</title>

  <!-- Font Awesome 6 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css?v=2">
</head>

<body class="login-page">

  <div class="login-container">

    <!-- LOGO -->
    <div class="login-brand">
      <img
        src="assets1/logo.png"
        alt="Việt Anh Company"
        class="login-logo"
      >

      <h1>VIỆT ANH</h1>

      <p>
        Hệ thống quản lý cho thuê xe công trình
      </p>
    </div>


    <!-- FORM ĐĂNG NHẬP -->
    <div class="login-card">

      <div class="login-title">
        <h2>Đăng nhập</h2>

        <p>
          Đăng nhập vào hệ thống nhân viên
        </p>
      </div>


      <form id="loginForm">

        <!-- TÊN ĐĂNG NHẬP -->
        <div class="form-group">

          <label for="username">
            Tên đăng nhập
          </label>

          <div class="input-wrapper">

            <i class="fas fa-user"></i>

            <input
              type="text"
              id="username"
              placeholder="Nhập tên đăng nhập"
              autocomplete="username"
              required
            >

          </div>

        </div>


        <!-- MẬT KHẨU -->
        <div class="form-group">

          <label for="password">
            Mật khẩu
          </label>

          <div class="input-wrapper">

            <i class="fas fa-lock"></i>

            <input
              type="password"
              id="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Hiển thị mật khẩu"
            >
              <i class="fas fa-eye"></i>
            </button>

          </div>

        </div>


        <!-- TÙY CHỌN -->
        <div class="login-options">

          <label>
            <input
              type="checkbox"
              id="rememberMe"
            >

            Ghi nhớ đăng nhập
          </label>

          <a href="#">
            Quên mật khẩu?
          </a>

        </div>


        <!-- BUTTON -->
        <button
          type="submit"
          class="login-btn"
        >
          Đăng nhập
        </button>


        <!-- THÔNG BÁO LỖI -->
        <p
          id="loginError"
          class="login-error"
        ></p>

      </form>

    </div>


    <!-- FOOTER -->
    <div class="login-footer">
      © 2026 CÔNG TY TNHH DỊCH VỤ THƯƠNG MẠI VIỆT ANH
    </div>

  </div>


  <script src="scripts.js"></script>

</body>
</html>
